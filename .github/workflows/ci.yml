name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # 历史遗留类型错误较多（multer / ali-oss 缺类型声明、database.ts 重载不匹配、
      # 测试文件用 jest 全局等），暂不阻塞流水线，只保留可见性。
      - name: Type check (不阻塞)
        run: npx tsc --noEmit
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # 只跑单元测试；tests/integration/** 需要真实后端，见文件末尾说明
      - name: Unit tests
        run: npx vitest run --exclude "tests/integration/**"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

# 注：tests/integration/** 需要在本地起后端（server.ts）与 MySQL 才能跑，
# CI 里无法自足，故不在流水线中执行。需要时本地跑：
#   npm run test:integration
