name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # 历史遗留类型错误较多（multer / ali-oss 缺类型声明、database.ts 重载不匹配、
      # 测试文件用 jest 全局等），暂不阻塞流水线，只保留可见性。
      - name: Type check (不阻塞)
        run: npx tsc --noEmit
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # 只跑单元测试；tests/integration/** 需要真实后端在跑，留给下面的 Integration Tests
      - name: Unit tests
        run: npx vitest run --exclude "tests/integration/**"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    # 这组用例需要真实后端进程在跑（会请求 /api/*），CI 里只起了 MySQL，
    # 因此暂不阻塞流水线；真要跑需先启动 server.ts。
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-pass
          MYSQL_DATABASE: schedule_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Run integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ci-pass
          DB_NAME: schedule_system
          JWT_SECRET: ci-test-secret
        run: npm run test:integration
