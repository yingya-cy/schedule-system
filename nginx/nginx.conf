            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }
        # ===== 感恩打卡（gratitude）=====
        location /api/gratitude/ {
            proxy_pass http://172.17.0.1:5004/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }
        location /gview {
            proxy_pass http://172.17.0.1:5004/gview;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

                                location /internship/ {
            proxy_pass http://172.17.0.1:5003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }
        location /insurance/ {
            proxy_pass http://172.17.0.1:5001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /survey/ {
            proxy_pass http://172.17.0.1:3099/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "no-store";
        }
location = /thesis.html {
            proxy_pass http://172.17.0.1:3100/thesis.html;
