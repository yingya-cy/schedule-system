events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { application/javascript mjs; }
    charset utf-8;
    charset_types text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml application/rss+xml;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 20M;
        location / {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, must-revalidate";
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        location /api/ {
            resolver 127.0.0.11 valid=30s;
            set $backend_upstream backend:3001;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }
    }

    # ===== IP 直连访问专用块（临时，用户用 IP 应急）=====
    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 50M;
        # 主页/静态
        location / {
            root /usr/share/nginx/html;
            index index.html;
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
                        # 论文智能体 (透明代理到 3100,保留路径)
                # 论文智能体的静态资源(可选,兼容直接访问)
        location = /thesis.html {
            proxy_pass http://172.17.0.1:3100/thesis.html;
            proxy_set_header Host $host;
        }
        location /jszip.min.js { proxy_pass http://172.17.0.1:3100/jszip.min.js; }
        location /docx-preview.min.js { proxy_pass http://172.17.0.1:3100/docx-preview.min.js; }
        # 论文智能体 API
        location ~ ^/(generate-paper|chat|export-docx|export-booklet|export-review-form|batch-generate|output|uploads) {
            proxy_pass http://172.17.0.1:3100$request_uri;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }

                        # internship
        location /internship/ {
            proxy_pass http://172.17.0.1:5003/;
            proxy_set_header Host $host;
        }
        # insurance
        location /insurance/ {
            proxy_pass http://172.17.0.1:5001/;
            proxy_set_header Host $host;
        }
        # survey
        location /survey/ {
            proxy_pass http://172.17.0.1:3099/;
            proxy_set_header Host $host;
        }
        # 感恩树（21天感恩成长记）
        location /thanks/ {
            alias /usr/share/nginx/html/thanks/;
            try_files $uri $uri/ /thanks/index.html;
        }
        # 21天感恩打卡
        location /gratitude/ {
            alias /usr/share/nginx/html/gratitude/;
            try_files $uri $uri/ /gratitude/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }
        # 打卡图片查看页 -> 5004
        location /gview {
            proxy_pass http://172.17.0.1:5004/gview;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # 打卡 API -> 5004
        location /api/gratitude/ {
            proxy_pass http://172.17.0.1:5004/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 20m;
            proxy_read_timeout 120s;
        }

    }

    server {
        listen 80;
        server_name yingyacy.top ai.yingyacy.top;
        location /.well-known/acme-challenge/ { root /usr/share/nginx/acme; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name yingyacy.top;
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        client_max_body_size 50M;
        location / {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, must-revalidate";
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        location /api/ {
            resolver 127.0.0.11 valid=30s;
            set $backend_upstream backend:3001;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
