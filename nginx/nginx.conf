        }


    }

    server {
        listen 443 ssl;
        server_name ai.yingyacy.top;
        proxy_buffering off;
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
