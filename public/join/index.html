<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>朋辈招新 · 加入我们</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #faf3e8;
    color: #25221e;
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px 48px; }
  .logo {
    display: inline-block; background: #bd3d37; color: #fff;
    font-weight: 900; font-size: 13px; letter-spacing: 2px;
    padding: 6px 14px; border-radius: 999px; margin-bottom: 16px;
  }
  h1 { font-size: 26px; margin-bottom: 10px; line-height: 1.3; }
  .sub { font-size: 14px; color: #756f66; line-height: 1.8; margin-bottom: 6px; }
  .tip {
    background: #fff3e0; border: 1px dashed #e0a24b; color: #9a6b1f;
    font-size: 12px; line-height: 1.7; border-radius: 12px;
    padding: 10px 14px; margin: 14px 0 22px;
  }
  .card {
    background: #fffdf7; border: 1px solid #e8e0d3; border-radius: 18px;
    padding: 18px 18px 16px; margin-bottom: 16px; text-align: center;
  }
  .card .name { font-size: 17px; font-weight: 900; margin-bottom: 12px; }
  .card img { width: 200px; height: 200px; border-radius: 14px; background: #fff; border: 1px solid #eee; }
  .card .hint { font-size: 12px; color: #9a958c; margin-top: 10px; line-height: 1.6; }
  .footer { text-align: center; color: #9a958c; font-size: 12px; margin-top: 26px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">朋辈心理健康服务队</div>
  <h1>欢迎加入朋辈 🙌</h1>
  <p class="sub">招新进行中！扫码进你校区的咨询群聊聊天，或直接填报名表——两件事都可以，没有先后顺序。</p>
  <div class="tip">🔒 本页面二维码长期有效：群聊二维码每 7 天会更新，本页会同步换新，之前保存的页面二维码随时可扫，不会失效。</div>

  <div class="card">
    <div class="name">📝 招新报名表</div>
    <img src="素材/qrcode-baoming.png" alt="报名表二维码">
    <div class="hint">长按识别二维码，填写报名表</div>
  </div>

  <div class="card">
    <div class="name">💬 河源校区咨询群</div>
    <img src="素材/qrcode-heyuan-0926.png" alt="河源校区群二维码">
    <div class="hint">长按识别进群 · 如过期请过段时间再试（会定期更新）</div>
  </div>

  <div class="card">
    <div class="name">💬 白云校区咨询群</div>
    <img src="素材/qrcode-baiyun-0918b.png" alt="白云校区群二维码">
    <div class="hint">长按识别进群 · 如过期请过段时间再试（会定期更新）</div>
  </div>

  <div class="footer">
    朋辈心理健康服务队 · 部门专属测试<br>
    <a href="https://yingyacy.top/mbti-classic/" style="color:#bd3d37;">先测测你适合哪个部门 →</a>
  </div>
</div>
</body>
</html>
